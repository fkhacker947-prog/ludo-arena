<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon Maker</title>
<style>
  body { font-family: Arial; text-align: center; background: #06255a; color: #fff; padding: 20px; }
  canvas { width: 240px; height: 240px; border-radius: 30px; }
  button { display: block; margin: 14px auto; padding: 14px 24px; font-size: 18px; border: 0; border-radius: 10px; background: #ffd700; font-weight: bold; }
</style></head>
<body>
<h3>Ludo Arena Icon Maker</h3>
<canvas id="c" width="512" height="512"></canvas>
<button onclick="save(512,'icon-512.png')">Download icon-512.png</button>
<button onclick="save(192,'icon-192.png')">Download icon-192.png</button>
<script>
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw(ctx, s) {
  ctx.save();
  ctx.scale(s / 512, s / 512);
  var g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#1e6fe0');
  g.addColorStop(1, '#08265f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);

  ctx.save();
  ctx.translate(256, 215);
  ctx.rotate(-0.17);
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#ffffff';
  rr(ctx, -130, -130, 260, 260, 44);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  var P = [[-70, -70], [70, -70], [-70, 70], [70, 70], [0, 0]];
  P.forEach(function (p, i) {
    ctx.beginPath();
    ctx.arc(p[0], p[1], 28, 0, Math.PI * 2);
    ctx.fillStyle = i === 4 ? '#e53935' : '#1b1b1b';
    ctx.fill();
  });
  ctx.restore();

  ctx.font = 'bold 66px Arial Black, Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd84d';
  ctx.strokeStyle = '#6e5200';
  ctx.lineWidth = 6;
  ctx.strokeText('LUDO', 256, 410);
  ctx.fillText('LUDO', 256, 410);
  ctx.restore();
}
draw(document.getElementById('c').getContext('2d'), 512);
function save(size, name) {
  var cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  draw(cv.getContext('2d'), size);
  cv.toBlob(function (b) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    a.click();
  });
}
</script>
</body></html>
